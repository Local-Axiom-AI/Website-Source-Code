<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Try Private Axiom</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ------------- Modal & Grid styling ------------------------------------ */
    .model-modal {
      display: none; /* hidden by default */
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      overflow-y: auto;
      padding: 2rem;
      box-sizing: border-box;
    }
    .model-modal .content {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .model-modal h2 { margin-top: 0; }
    .model-search {
      width: 100%;
      padding: .5rem 1rem;
      margin-bottom: 1rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .model-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }
    .model-card {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: .75rem;
      cursor: pointer;
      transition: box-shadow .2s, transform .1s;
      text-align: center;
    }
    .model-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }
    .model-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: .5rem;
    }
    .model-card h4 { margin: .5rem 0 0; }
    .model-card p {
      margin: .25rem 0 0;
      font-size: .85rem;
      color: #555;
    }
    .model-modal .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }
    
    /* Chat history styling */
    .chat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    .chat-item:hover {
      background-color: #f5f5f5;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #ff4757;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .delete-btn:hover {
      color: #ff2e43;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="new-chat-row">
          <button onclick="startNewChat()">+ New Chat</button>
          <!-- hidden <select> that the rest of the code uses -->
          <select id="modelSelect" style="display:none">
   <!-- All your models – first one is the default -->
      <option value="gpt_oss_20b" selected>GPT-OSS</option>
      <option value="gemma3_27b">Gemma-3 27B</option>
      <option value="gemma3_1b">Gemma-3 1B</option>
      <option value="qwen3_coder_30b">Qwen-3-Coder 30B</option>
      <option value="qwen3_4b">Qwen-3 4B</option>
      <option value="llama3_1_8b">Llama-3.1 8B</option>
   <option value="Chan_AI_Uncensored">Chan AI 4B</option>
   <option value="LinguaTale_EN_ES">LinguaTale-EN-ES</option>
   <option value="z_image">Qwen Z Image</option>
          </select>
          <!-- button that opens the modal -->
          <button id="changeModelBtn" onclick="openModelModal()">Change Model</button>
        </div>
      </div>
      <div class="sidebar-label">Previous Chats</div>
      <div class="chat-history" id="chatHistory">
        <p>No previous chats</p>
      </div>
    </div>
    <div class="container">
      <div class="chatbox" id="chatbox"></div>
      <div class="input-area" id="inputArea">
        <textarea id="userInput" placeholder="Type your message..." rows="1"
          oninput="autoResize(this)" onkeypress="handleKeyPress(event)"></textarea>
        <button id="sendBtn" onclick="sendMessage()">&#10148;</button>
      </div>
    </div>
  </div>
  <!-- The modal that shows the grid of models -->
  <div id="modelModal" class="model-modal">
    <div class="content">
      <button class="close-btn" onclick="closeModelModal()">&times;</button>
      <h2>Select a model</h2>
      <input type="text" id="modelSearch" class="model-search"
             placeholder="Search models..." oninput="filterModels()">
      <div class="model-grid" id="modelGrid">
        <!-- cards are inserted by JS -->
      </div>
    </div>
  </div>
  <footer class="footer" id="footer">
    <div class="footer-content">
      <span><a href="/tos" target="_blank">Terms of Service</a></span>
      <span><a href="/privacy" target="_blank">Privacy Policy</a></span>
      <span><a href="q_a" target="_blank">Q and A</a></span>
    </div>
    <button class="footer-close"
  onclick="document.getElementById('footer').style.display='none'">
  &times;
</button>  </footer>
  <script src="/script.js"></script>
</body>
</html>
